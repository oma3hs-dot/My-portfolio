<!DOCTYPE html>
<html>
<head>
    <title>PC Accessories Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>PC Store</h2>

        <div>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>


    <section id="home" class="hero">

        <div>
            <h1>Upgrade Your Setup</h1>

            <p>
                Find the best PC accessories for your gaming and work setup.
            </p>

            <button onclick="showProducts()">Shop Now</button>
        </div>

    </section>


    <section id="products">

        <h2 class="section-title">Our Products</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search for a product..."
            onkeyup="searchProducts()"
        >

        <div id="productsContainer" class="products-container">

        </div>

    </section>


    <section id="cart">

        <h2 class="section-title">Shopping Cart</h2>

        <div id="cartContainer">

            <p id="emptyCart">Your cart is empty.</p>

        </div>

        <div class="cart-total">

            <h3>
                Total:
                $<span id="totalPrice">0</span>
            </h3>

            <button onclick="clearCart()">Clear Cart</button>

        </div>

    </section>


    <section id="contact">

        <h2 class="section-title">Contact Us</h2>

        <div class="contact-form">

            <input
                type="text"
                id="nameInput"
                placeholder="Your Name"
            >

            <input
                type="email"
                id="emailInput"
                placeholder="Your Email"
            >

            <textarea
                id="messageInput"
                placeholder="Your Message"
            ></textarea>

            <button onclick="sendMessage()">Send Message</button>

            <p id="messageResult"></p>

        </div>

    </section>


    <footer>

        <p>© 2026 PC Store - All Rights Reserved</p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
